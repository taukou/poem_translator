<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poem Translator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="page-shell">
        <header class="hero">
            <div class="hero-copy">
                <p class="eyebrow">Poem Translator</p>
                <h1>古詩翻譯與情緒分析</h1>
            </div>
        </header>

        <main class="layout">
            <section class="panel panel-input">
                <div class="panel-header">
                    <h2>輸入內容</h2>
                </div>

                <div class="poem-picker">
                    <label for="poemSelect">從唐詩三百首選擇詩名</label>
                    <select id="poemSelect">
                        <option value="">載入詩詞清單中...</option>
                    </select>
                </div>

                <label for="inputText">輸入古文</label>
                <textarea
                    id="inputText"
                    placeholder="選擇詩名後會自動帶入，或直接輸入要翻譯的古詩詞..."
                    rows="12"
                ></textarea>

                <div class="field-row">
                    <div class="field-group">
                        <label for="targetSelect">選擇目標語言</label>
                        <select id="targetSelect">
                            <option value="de" selected>德文 (de)</option>
                            <option value="en">英文 (en)</option>
                            <option value="fr">法文 (fr)</option>
                            <option value="ja">日文 (ja)</option>
                        </select>
                    </div>
                </div>

                <div class="button-section">
                    <button id="translateBtn" class="btn btn-primary">翻譯並分析</button>
                    <button id="clearBtn" class="btn btn-secondary">清除</button>
                </div>

                <div id="loadingSpinner" class="spinner hidden"></div>

                <div class="example-card">
                    <h3>範例</h3>
                    <p>點擊快速填入示例詩句。</p>
                    <div class="example-buttons">
                        <button class="btn btn-secondary" id="example1">竹里館</button>
                        <button class="btn btn-secondary" id="example2">春望</button>
                        <button class="btn btn-secondary" id="example3">靜夜思</button>
                    </div>
                </div>

                <div id="errorMessage" class="error-message hidden"></div>
            </section>

            <section class="panel panel-output">
                <div class="panel-header">
                    <h2>輸出結果</h2>
                </div>

                <div id="outputSection" class="output-grid">
                    <article class="result-card">
                        <div class="result-card-header">
                            <h3>白話文解釋</h3>
                            <span class="result-tag">Modern Chinese</span>
                        </div>
                        <div id="modernText" class="output-text placeholder-text">輸入古文後，這裡會顯示白話文解釋。</div>
                    </article>

                    <article class="result-card">
                        <div class="result-card-header">
                            <h3>翻譯結果</h3>
                            <span id="targetLang" class="result-tag"></span>
                        </div>
                        <div id="outputText" class="output-text placeholder-text">翻譯完成後，這裡會顯示目標語言的翻譯結果。</div>
                        <button id="copyBtn" class="btn btn-copy">複製翻譯結果</button>
                    </article>

                    <article class="result-card emotion-card">
                        <div class="result-card-header">
                            <h3>情緒分析</h3>
                            <span class="result-tag">Emotion</span>
                        </div>
                        <div id="emotionSummary" class="emotion-summary empty-state">
                            等待分析結果。
                        </div>
                        <div id="emotionSentences" class="emotion-sentences"></div>
                    </article>
                </div>
            </section>
        </main>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
