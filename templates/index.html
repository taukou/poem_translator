<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poem Translator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <header>
            <h1>Poem Translator</h1>
            <p class="subtitle">將古詩詞轉為現代文</p>
        </header>

        <main>
            <div class="translator-box">
                <div class="input-section">
                    <label for="inputText">輸入古文</label>
                    <textarea 
                        id="inputText" 
                        placeholder="請輸入要翻譯的古詩詞..." 
                        rows="6"
                    ></textarea>
                    <label for="targetSelect" style="margin-top:10px;">選擇目標語言</label>
                    <select id="targetSelect" style="padding:8px;border-radius:6px;border:1px solid #d0e7ff;">
                        <option value="de" selected>德文 (de)</option>
                        <option value="en">英文 (en)</option>
                        <option value="fr">法文 (fr)</option>
                        <option value="jp">日文 (ja)</option>
                    </select>
                </div>

                <div class="button-section">
                    <button id="translateBtn" class="btn btn-primary">翻譯</button>
                    <button id="clearBtn" class="btn btn-secondary">清除</button>
                </div>

                <div id="loadingSpinner" class="spinner hidden"></div>

                <div class="output-section" id="outputSection" style="display: none;">
                    <label>白話文</label>
                    <div id="modernText" class="output-text"></div>
                    <label>目標語言</label>
                    <div id="targetLang" class="output-text" style="min-height:40px;"></div>
                    <label>翻譯結果</label>
                    <div id="outputText" class="output-text"></div>
                    <button id="copyBtn" class="btn btn-copy">複製結果</button>
                </div>

                <div id="errorMessage" class="error-message" style="display: none;"></div>
            </div>

            <footer class="info-box">
                <h3>使用說明</h3>
                <ol>
                    <li>在「輸入古文」欄貼上古詩詞。</li>
                    <li>從「選擇目標語言」下拉選擇目標語言（預設：德文 de）。</li>
                    <li>點擊「翻譯」或按 <kbd>Ctrl+Enter</kbd>，系統會先將古文轉為白話中文，再翻譯成目標語言。</li>
                    <li>結果會顯示：原文、白話中文、目標語言、翻譯結果；點「複製結果」可複製翻譯。</li>
                </ol>

                <h4>範例（點擊快速填入）</h4>
                <p>按下下列按鈕會把範例詩句填入並自動開始翻譯：</p>
                <div class="example-buttons" style="display:flex;gap:8px;margin-bottom:12px;">
                    <button class="btn btn-secondary" id="example1">範例：竹里館</button>
                    <button class="btn btn-secondary" id="example2">範例：春望</button>
                    <button class="btn btn-secondary" id="example3">範例：靜夜思</button>
                </div>

                

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
